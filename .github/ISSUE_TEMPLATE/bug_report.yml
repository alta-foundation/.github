name: Bug report
description: Report reproducible incorrect behavior without sharing private data.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, recordings, transcripts, or personal data. For security issues, follow SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. v0.2.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized logs
      description: Include OS, runtime, relevant configuration names, and redacted errors.
